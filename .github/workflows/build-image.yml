# 共用的 CI 模板: 镜像只构建一次(tag = 提交)→ 推到 GHCR → 漏洞扫描 → SBOM →(可选)签名。
# 调用方: jobs.<id>.uses: MIERAI/gitops-platform-blueprint/.github/workflows/build-image.yml@main
#         permissions: { contents: read, packages: write, id-token: write(签名时) }
name: build-image
on:
  workflow_call:
    inputs:
      image: { description: "镜像名(ghcr.io/<owner>/<image>)", type: string, required: true }
      dockerfile: { type: string, default: Dockerfile }
      context: { type: string, default: . }
      sign: { description: "cosign 无密钥签名(签名记录进公开的透明日志: 私有仓库的名字会公开)", type: boolean, default: false }
      fail-on-critical: { description: "有可修复的 CRITICAL 漏洞时失败", type: boolean, default: true }
    outputs:
      tag: { value: "${{ jobs.build.outputs.tag }}" }
      digest: { value: "${{ jobs.build.outputs.digest }}" }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - id: names
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.repo }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
          provenance: false
      - name: 漏洞扫描(Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.repo }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: ${{ inputs.fail-on-critical && '1' || '0' }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
      - name: SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.names.outputs.repo }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom-${{ inputs.image }}.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - if: inputs.sign
        uses: sigstore/cosign-installer@v4.1.3
      - if: inputs.sign
        name: 签名(无密钥)
        run: cosign sign --yes "${{ steps.names.outputs.repo }}@${{ steps.push.outputs.digest }}"
      - name: 结果
        run: |
          echo "### ${{ inputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
