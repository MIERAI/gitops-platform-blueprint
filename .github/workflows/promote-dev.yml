# 共用的 CI 模板: gitops-manifests 里 <app> 的 dev 的镜像更新(Argo CD 接着同步)。哪个文件: <app>/app.yaml。
# 镜像名可以和 manifests 里的不同(fork: ghcr.io/<你>/<name>):按最后一段认出是同一个镜像,改成你的(newName / repository)。
# 认证: gitops-manifests 的部署密钥(只对这一个仓库有写权限),调用方的 secret MANIFESTS_DEPLOY_KEY
name: promote-dev
on:
  workflow_call:
    inputs:
      app: { type: string, required: true }
      images: { description: "空格隔开的 <镜像>=<tag>(镜像 = ghcr.io/<owner>/<name>)", type: string, required: true }
      manifests: { description: "owner/name; default: <the caller's owner>/gitops-manifests (a fork works as is)", type: string, default: "" }
      env: { type: string, default: dev }
    secrets:
      MANIFESTS_DEPLOY_KEY: { required: true }
jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency: { group: "promote-${{ inputs.app }}-${{ inputs.env }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.manifests || format('{0}/gitops-manifests', github.repository_owner) }}
          ssh-key: ${{ secrets.MANIFESTS_DEPLOY_KEY }}
      - name: PyYAML(manifests 仓库的脚本读 <app>/app.yaml)
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml >/dev/null
      - name: 更新 tag 并推送(和别的应用同时推送时重试)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            scripts/set-image.sh "${{ inputs.app }}" "${{ inputs.env }}" ${{ inputs.images }}
            if git diff --quiet; then echo "已经是这个版本"; exit 0; fi
            git commit -qam "${{ inputs.app }} ${{ inputs.env }}: ${{ inputs.images }} (${{ github.repository }}@${GITHUB_SHA::7})"
            git push -q origin HEAD:main && { echo "✓ pushed"; exit 0; }
            sleep $((i * 3))
          done
          exit 1
